services:
  nvr:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "${NVR_BIND_IP:-127.0.0.1}:8080:8080"
    environment:
      NVR_ADMIN_PASSWORD: "${NVR_ADMIN_PASSWORD:?Impostare una password di almeno 12 caratteri in .env}"
      NVR_SEGMENT_SECONDS: "${NVR_SEGMENT_SECONDS:-1800}"
      NVR_CACHE_DIR: "${NVR_CACHE_DIR:-/recordings/.cache}"
      NVR_MIN_FREE_GB: "${NVR_MIN_FREE_GB:-5}"
      NVR_SECURE_COOKIE: "${NVR_SECURE_COOKIE:-0}"
      NVR_LIVE_MAX_STREAMS: "${NVR_LIVE_MAX_STREAMS:-16}"
      NVR_LIVE_MAX_TRANSCODES: "${NVR_LIVE_MAX_TRANSCODES:-2}"
    volumes:
      - nvr-data:/data
      - "${NVR_RECORDINGS_PATH:-./recordings}:/recordings"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
volumes:
  nvr-data:
