[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nvr-sr81"
version = "0.15.0"
description = "Local NVR with continuous RTSP recording and a multilingual web interface"
requires-python = ">=3.11"
license = "GPL-3.0-only"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.46,<1",
  "wsproto>=1.2,<2",
  "httpx>=0.28,<1",
  "cryptography>=44,<50",
  "defusedxml>=0.7,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[project.scripts]
nvr-sr81 = "nvr.__main__:main"

[tool.setuptools.package-data]
nvr = ["static/*", "locales/*.json"]

[tool.setuptools.packages.find]
include = ["nvr*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

