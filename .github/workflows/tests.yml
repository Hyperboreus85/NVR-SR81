name: Verify NVR
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install local RTSP test server
        run: |
          curl --fail --location --silent --show-error --retry 3 -o "$RUNNER_TEMP/mediamtx.tar.gz" https://github.com/bluenviron/mediamtx/releases/download/v1.21.2/mediamtx_v1.21.2_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/mediamtx.tar.gz" -C "$RUNNER_TEMP" mediamtx
          echo "NVR_TEST_RTSP_SERVER=$RUNNER_TEMP/mediamtx" >> "$GITHUB_ENV"
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q
      - name: Check browser scripts
        run: |
          node --check nvr/static/app.js
          node --check nvr/static/live-player.js
      - run: |
          bash -n deploy/install.sh
          bash -n deploy/proxmox-create.sh
          bash -n deploy/update.sh
